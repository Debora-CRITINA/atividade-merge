<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Funcionários</title>
</head>
<body>


    <h1>Sistema de Funcionários</h1>

    <h2>Cadastro de Funcionário</h2>

    <form>

        <label>Nome:</label>
        <input type="text">

        <br><br>

        <label>E-mail:</label>
        <input type="email">

        <br><br>

        <label>Cargo:</label>
        <input type="text">

        <br><br>

        <label>Salário:</label>
        <input type="number">

        <br><br>

        <button type="submit">
            Cadastrar
        </button>

    </form>



</body>
</html>
